version: "3.9"

services:
  temp-mail-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      HEADLESS: "true"
      LOG_LEVEL: "INFO"
      PORT: "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/email"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s   # give Chromium time to spin up
